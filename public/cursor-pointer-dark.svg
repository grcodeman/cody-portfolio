<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <defs>
    <g id="hand">
      <rect x="8" y="2" width="3.8" height="12" rx="1.9"/>
      <rect x="4.6" y="14" width="3.6" height="6.8" rx="1.8"/>
      <rect x="7.6" y="10.8" width="11.8" height="12.2" rx="4.4"/>
    </g>
  </defs>
  <!-- stroked copy behind the fill: outlines the union without showing seams between the parts -->
  <use href="#hand" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <use href="#hand" fill="#2563eb"/>
</svg>
