<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <g id="hand">
      <rect x="9.2" y="2" width="3.8" height="12" rx="1.9"/>
      <rect x="4.8" y="13.5" width="3.6" height="7" rx="1.8"/>
      <rect x="7" y="10.8" width="12.4" height="12.2" rx="4.5"/>
    </g>
  </defs>
  <!-- stroked copy behind the fill: outlines the union without showing seams between the parts -->
  <use href="#hand" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <use href="#hand" fill="url(#g)"/>
</svg>
